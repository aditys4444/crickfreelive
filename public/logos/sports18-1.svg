<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
  <defs>
    <linearGradient id="s18Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20"/>
      <stop offset="50%" stop-color="#1A1238"/>
      <stop offset="100%" stop-color="#0C1A30"/>
    </linearGradient>
    <linearGradient id="s18Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="s18Pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="400" height="180" rx="10" fill="url(#s18Bg)"/>

  <polygon points="40,0 80,0 160,180 0,180" fill="rgba(6,182,212,0.15)"/>
  <polygon points="360,0 320,0 240,180 400,180" fill="rgba(236,72,153,0.12)"/>

  <!-- Brand Typography -->
  <text x="32" y="48" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="4" fill="#94A3B8">SPORTS</text>

  <!-- Big Stylized "18" -->
  <g transform="translate(32, 54)">
    <text x="0" y="44" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#s18Cyan)">18</text>
  </g>

  <!-- Channel Number "1" and HD Badge -->
  <g transform="translate(130, 52)">
    <rect width="90" height="52" rx="8" fill="url(#s18Pink)"/>
    <text x="45" y="38" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">1 HD</text>
  </g>

  <!-- JioCinema / Viacom18 Network Tag -->
  <g transform="translate(240, 56)">
    <rect width="130" height="44" rx="6" fill="#1E1B4B" stroke="#4338CA" stroke-width="1.5"/>
    <text x="65" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#A5B4FC" text-anchor="middle">LIVE CRICKET</text>
  </g>

  <rect x="0" y="142" width="400" height="38" fill="rgba(15,23,42,0.85)"/>
  <circle cx="30" cy="161" r="4.5" fill="#10B981"/>
  <text x="44" y="165" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">INDIA &amp; IPL BROADCASTER</text>
  <text x="375" y="165" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#10B981" text-anchor="end">1080p</text>
</svg>

