<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
  <defs>
    <linearGradient id="willowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021C16"/>
      <stop offset="50%" stop-color="#06382C"/>
      <stop offset="100%" stop-color="#032019"/>
    </linearGradient>
    <linearGradient id="willowGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="400" height="180" rx="10" fill="url(#willowBg)"/>

  <!-- Beams -->
  <polygon points="50,0 110,0 200,180 10,180" fill="rgba(16,185,129,0.12)"/>
  <polygon points="360,0 300,0 210,180 390,180" fill="rgba(52,211,153,0.1)"/>

  <!-- Willow Tree / Cricket Emblem -->
  <g transform="translate(48, 62)">
    <circle cx="0" cy="0" r="26" fill="#044E3D" stroke="#10B981" stroke-width="2"/>
    <path d="M -10 12 L 0 -18 L 10 12 Z" fill="#34D399"/>
    <circle cx="0" cy="-6" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <text x="96" y="52" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="1" fill="#FFFFFF">WILLOW</text>
  <text x="96" y="80" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#34D399">CRICKET HD</text>

  <!-- HD Tag -->
  <g transform="translate(295, 42)">
    <rect width="70" height="48" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="35" y="32" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">HD</text>
  </g>

  <rect x="0" y="142" width="400" height="38" fill="rgba(15,23,42,0.85)"/>
  <circle cx="30" cy="161" r="4.5" fill="#10B981"/>
  <text x="44" y="165" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">ICC &amp; 24/7 INTERNATIONAL CRICKET</text>
  <text x="375" y="165" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#10B981" text-anchor="end">1080p</text>
</svg>

