<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
  <defs>
    <linearGradient id="euroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
  </defs>

  <rect width="400" height="180" rx="10" fill="url(#euroBg)"/>

  <polygon points="40,0 80,0 160,180 0,180" fill="rgba(59,130,246,0.15)"/>
  <polygon points="360,0 320,0 240,180 400,180" fill="rgba(96,165,250,0.1)"/>

  <!-- Eurosport Star Ring -->
  <g transform="translate(50, 62)">
    <circle cx="0" cy="0" r="28" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2"/>
    <text x="0" y="7" font-family="-apple-system, sans-serif" font-size="20" fill="#FBBF24" text-anchor="middle">★</text>
  </g>

  <!-- Typography -->
  <text x="96" y="56" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="1" fill="#FFFFFF">EUROSPORT</text>
  <text x="96" y="80" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="4" fill="#60A5FA">SPORTS NETWORK</text>

  <!-- HD Pill -->
  <g transform="translate(300, 42)">
    <rect width="66" height="48" rx="8" fill="#0F172A" stroke="#60A5FA" stroke-width="2"/>
    <text x="33" y="32" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#60A5FA" text-anchor="middle">HD</text>
  </g>

  <rect x="0" y="142" width="400" height="38" fill="rgba(15,23,42,0.85)"/>
  <circle cx="30" cy="161" r="4.5" fill="#10B981"/>
  <text x="44" y="165" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">GLOBAL CRICKET &amp; WORLD SPORTS</text>
  <text x="375" y="165" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#10B981" text-anchor="end">1080p</text>
</svg>

