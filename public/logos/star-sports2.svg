<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
  <defs>
    <linearGradient id="star2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08142C"/>
      <stop offset="50%" stop-color="#0F2856"/>
      <stop offset="100%" stop-color="#091733"/>
    </linearGradient>
    <linearGradient id="starGold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="400" height="180" rx="10" fill="url(#star2Bg)"/>

  <!-- Beams -->
  <polygon points="60,0 120,0 200,180 0,180" fill="rgba(245,158,11,0.12)"/>
  <polygon points="360,0 300,0 220,180 400,180" fill="rgba(59,130,246,0.15)"/>

  <!-- Star Icon -->
  <g transform="translate(48, 62)">
    <polygon points="0,-32 10,-10 32,-10 15,4 22,25 0,12 -22,25 -15,4 -32,-10 -10,-10" fill="url(#starGold2)"/>
  </g>

  <!-- Typography -->
  <text x="96" y="52" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="1" fill="#FFFFFF">STAR</text>
  <text x="96" y="80" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" letter-spacing="2" fill="#E2E8F0">SPORTS</text>

  <!-- Big Number "2" & HD Badge -->
  <g transform="translate(250, 24)">
    <rect width="60" height="74" rx="8" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2"/>
    <text x="30" y="54" font-family="-apple-system, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
  </g>

  <g transform="translate(320, 36)">
    <rect width="52" height="50" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="26" y="33" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#FBBF24" text-anchor="middle">HD</text>
  </g>

  <rect x="0" y="142" width="400" height="38" fill="rgba(15,23,42,0.85)"/>
  <circle cx="30" cy="161" r="4.5" fill="#10B981"/>
  <text x="44" y="165" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">LIVE BILATERAL &amp; WORLD CRICKET</text>
  <text x="375" y="165" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#10B981" text-anchor="end">1080p</text>
</svg>

