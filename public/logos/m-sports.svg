<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
  <defs>
    <linearGradient id="mSportsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="mCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <rect width="400" height="180" rx="10" fill="url(#mSportsBg)"/>

  <polygon points="40,0 80,0 160,180 0,180" fill="rgba(56,189,248,0.15)"/>
  <polygon points="360,0 320,0 240,180 400,180" fill="rgba(14,165,233,0.1)"/>

  <!-- Stylized "M" Crest -->
  <g transform="translate(48, 62)">
    <circle cx="0" cy="0" r="28" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2.5"/>
    <text x="0" y="11" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle">M</text>
  </g>

  <!-- Typography -->
  <text x="96" y="52" font-family="-apple-system, sans-serif" font-size="30" font-weight="900" letter-spacing="1" fill="#FFFFFF">SPORTS</text>
  <text x="96" y="80" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="3" fill="#38BDF8">LIVE CRICKET</text>

  <!-- HD Badge -->
  <g transform="translate(295, 42)">
    <rect width="70" height="48" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="35" y="32" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#38BDF8" text-anchor="middle">HD</text>
  </g>

  <rect x="0" y="142" width="400" height="38" fill="rgba(15,23,42,0.85)"/>
  <circle cx="30" cy="161" r="4.5" fill="#10B981"/>
  <text x="44" y="165" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">INTERNATIONAL CRICKET TOURNAMENTS</text>
  <text x="375" y="165" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#10B981" text-anchor="end">1080p</text>
</svg>

