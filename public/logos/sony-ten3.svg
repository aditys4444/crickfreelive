<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
  <defs>
    <linearGradient id="sonyTen3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1832"/>
      <stop offset="50%" stop-color="#102550"/>
      <stop offset="100%" stop-color="#1E1438"/>
    </linearGradient>
    <linearGradient id="sonyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="ten3Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Banner Background -->
  <rect width="400" height="180" rx="10" fill="url(#sonyTen3Bg)"/>

  <!-- Subtle Stadium Light Rays -->
  <polygon points="40,0 80,0 160,180 0,180" fill="rgba(59,130,246,0.12)"/>
  <polygon points="360,0 320,0 240,180 400,180" fill="rgba(245,158,11,0.08)"/>

  <!-- Left SONY Logo Badge -->
  <g transform="translate(30, 45)">
    <rect width="80" height="34" rx="4" fill="#000000" stroke="#334155" stroke-width="1.5"/>
    <text x="40" y="23" font-family="-apple-system, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">SONY</text>
  </g>

  <!-- "SPORTS" Label -->
  <text x="30" y="105" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="3" fill="#94A3B8">SPORTS</text>

  <!-- Big "TEN 3" Badge -->
  <g transform="translate(125, 38)">
    <rect width="160" height="64" rx="8" fill="url(#sonyRed)"/>
    <text x="80" y="44" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">TEN 3</text>
  </g>

  <!-- HD Pill & Language Tag -->
  <g transform="translate(295, 48)">
    <rect width="70" height="42" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="35" y="28" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#FBBF24" text-anchor="middle">HD</text>
  </g>

  <!-- Bottom Bar: Hindi Live Cricket -->
  <rect x="0" y="142" width="400" height="38" rx="0" fill="rgba(15,23,42,0.85)"/>
  <circle cx="30" cy="161" r="4.5" fill="#10B981"/>
  <text x="44" y="165" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">HINDI COMMENTARY • LIVE CRICKET</text>
  <text x="375" y="165" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#10B981" text-anchor="end">1080p</text>
</svg>

