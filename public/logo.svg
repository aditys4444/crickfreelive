  <!-- Wordmark -->
  <text x="54" y="32" font-size="24" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="-0.7px">
    Crick<tspan fill="#10B981">Free</tspan>
  </text>
