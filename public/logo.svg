    <path d="M10 11 C17 15 17 25 10 29" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M10 11 C17 15 17 25 10 29" stroke="#FECDD3" stroke-width="1.6" stroke-dasharray="2 2" fill="none"/>
    <path d="M30 11 C23 15 23 25 30 29" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M30 11 C23 15 23 25 30 29" stroke="#FECDD3" stroke-width="1.6" stroke-dasharray="2 2" fill="none"/>
    <polygon points="17.5,14.5 24.5,20 17.5,25.5" fill="#FFFFFF"/>
    <circle cx="33" cy="7" r="4.5" fill="#10B981" filter="url(#cfEmeraldGlow)"/>
    <circle cx="33" cy="7" r="2" fill="#FFFFFF"/>
