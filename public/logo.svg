<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none">
  <defs>
    <radialGradient id="cfBallGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="25%" stop-color="#F43F5E"/>
      <stop offset="65%" stop-color="#E11D48"/>
      <stop offset="90%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
    <filter id="cfEmeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#10B981" flood-opacity="0.8"/>
