<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <defs>
    <radialGradient id="intlSky" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="goldBeamL" x1="0%" y1="0%" x2="55%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#D97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blueBeamR" x1="100%" y1="0%" x2="45%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#2563EB" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="turfIntl" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#15803D" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#047857" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#intlSky)"/>

  <!-- Grand Colosseum Grandstands -->
  <path d="M 0 330 Q 800 210 1600 330 L 1600 600 L 0 600 Z" fill="#0B1120" opacity="0.95"/>
  <path d="M 0 370 Q 800 270 1600 370 L 1600 600 L 0 600 Z" fill="#050812"/>

  <path d="M 0 328 Q 800 208 1600 328" stroke="rgba(245, 158, 11, 0.35)" stroke-width="2.5" fill="none"/>
  <path d="M 120 300 Q 800 190 1480 300" stroke="rgba(96, 165, 250, 0.25)" stroke-width="1.5" fill="none"/>

  <!-- Volumetric Beams -->
  <polygon points="160,15 280,15 680,590 50,590" fill="url(#goldBeamL)"/>
  <polygon points="1440,15 1320,15 920,590 1550,590" fill="url(#blueBeamR)"/>

  <!-- Tower Lighting -->
  <g transform="translate(180, 20)">
    <rect x="-18" y="0" width="36" height="16" rx="4" fill="#FFFFFF"/>
    <circle cx="0" cy="8" r="32" fill="#F59E0B" opacity="0.4" filter="blur(8px)"/>
  </g>
  <g transform="translate(1420, 20)">
    <rect x="-18" y="0" width="36" height="16" rx="4" fill="#FFFFFF"/>
    <circle cx="0" cy="8" r="32" fill="#60A5FA" opacity="0.4" filter="blur(8px)"/>
  </g>

  <!-- Oval Pitch & Ropes -->
  <ellipse cx="800" cy="535" rx="760" ry="165" fill="#064E3B"/>
  <ellipse cx="800" cy="535" rx="760" ry="165" fill="url(#turfIntl)"/>
  <ellipse cx="800" cy="535" rx="740" ry="155" stroke="rgba(255, 255, 255, 0.5)" stroke-width="2.5" fill="none"/>
  <ellipse cx="800" cy="535" rx="510" ry="105" stroke="rgba(251, 191, 36, 0.4)" stroke-dasharray="10 8" stroke-width="2" fill="none"/>

  <!-- Center Strip -->
  <ellipse cx="800" cy="522" rx="138" ry="22" fill="#CBB285" opacity="0.9"/>
  <ellipse cx="800" cy="522" rx="136" ry="20" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" fill="none"/>
</svg>

